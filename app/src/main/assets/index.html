<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pro Inicio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- Barra de estado: hora, GPS, conexión, tiempo -->
  <header id="status">
    <div class="sleft"><span id="hora">--:--</span><span id="fecha"></span></div>
    <nav id="topRail" class="toprail"></nav>
    <div class="sright">
      <span id="stGps" class="sti off" title="GPS"><svg viewBox="0 0 24 24"><path d="M21 3 3 10.5l7.6 2.9L13.5 21z"/></svg></span>
      <span id="stNet" class="sti" title="Conexión"></span>
      <span id="stWeather" class="stw"><span id="wIcon">·</span><span id="wTemp">--°</span></span>
    </div>
  </header>

  <!-- Barra lateral (botones configurables) -->
  <nav id="rail"></nav>

  <!-- Mapa en directo -->
  <section id="mapCard">
    <div id="map"></div>
    <div id="mapOff" class="hide"><div>🗺️</div><b>Sin mapa</b><span>Aparecerá cuando haya internet</span></div>
    <div id="cardMsg" class="cardmsg hide"><div id="cmIcon" class="cmicon"></div><b id="cmTitle"></b><span id="cmText"></span><div id="cmBtns" class="cmbtns"></div></div>
    <button id="street" class="street">
      <svg viewBox="0 0 24 24"><path d="M12 3 5 13h4.5v8h5v-8H19z"/></svg>
      <span class="stxt"><b id="streetName">¿A dónde vamos?</b><small id="streetSub">Toca para navegar</small></span>
    </button>
    <button id="speedCard" class="speed">
      <span class="spv"><b id="spd">--</b><small>km/h</small></span>
      <span class="spi"><b id="cityName">Navegar</b><small id="hint">Toca para abrir</small></span>
    </button>
    <div class="mapbtns">
      <button id="zIn" class="mb" aria-label="Acercar"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
      <button id="zOut" class="mb" aria-label="Alejar"><svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg></button>
      <button id="locate" class="mb on" aria-label="Centrar"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.06A7 7 0 0 0 13 5.06V3h-2v2.06A7 7 0 0 0 5.06 11H3v2h2.06A7 7 0 0 0 11 18.94V21h2v-2.06A7 7 0 0 0 18.94 13H21zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg></button>
    </div>
  </section>

  <!-- Columna de tarjetas (configurables) -->
  <aside id="side">
    <section id="player" class="card hide">
      <div id="pTap" class="ptop">
        <div id="pArt" class="art"><span>PR</span></div>
        <div class="ptxt">
          <div id="pTitle" class="ptitle">Sin sonar</div>
          <div id="pSub" class="psub">Pro Radio</div>
        </div>
      </div>
      <div class="live">
        <div class="lbar"><i id="lfill"></i></div>
        <div class="lrow"><span id="lLeft" class="ltag">PRO RADIO</span><span id="lRight">Toca ▶</span></div>
      </div>
      <div class="pbtns">
        <button id="bPrev" class="pb" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg></button>
        <button id="bPlay" class="pb big" aria-label="Reproducir o pausar"><svg id="icPlay" viewBox="0 0 24 24"><path d="M8 4.5v15L20 12z"/></svg><svg id="icPause" viewBox="0 0 24 24" class="hide"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/></svg></button>
        <button id="bNext" class="pb" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM4 5v14l10.5-7z"/></svg></button>
      </div>
    </section>

    <section id="appsCard" class="card hide">
      <div id="appsGrid" class="grid"></div>
    </section>

    <section id="wxCard" class="card hide">
      <div class="wxnow"><span id="wxIcon" class="wxi">·</span><div><b id="wxTemp">--°</b><small id="wxDesc">Tiempo</small></div></div>
      <div id="wxHours" class="wxhours"></div>
    </section>

    <section id="clockCard" class="card hide">
      <b id="bigHora">--:--</b><small id="bigFecha"></small>
    </section>

    <!-- Tarjetas con un widget de Android (el widget lo pone Android encima de este hueco) -->
    <section id="wgTop" class="card wg hide"><div class="wgph"></div></section>
    <section id="wgBot" class="card wg hide"><div class="wgph"></div></section>

    <section id="spdBig" class="card hide">
      <b id="spdBigV">--</b><small>km/h</small><span id="spdBigSt"></span>
    </section>
  </aside>
</div>

<!-- Elegir (app, acción, tarjeta…) -->
<div id="picker" class="sheet hide">
  <div class="sheethead">
    <h2 id="pickTitle">Elegir</h2>
    <input id="buscar" type="search" placeholder="Buscar app…" autocomplete="off">
    <button class="close" data-close="picker" aria-label="Cerrar">✕</button>
  </div>
  <div id="pickList" class="pickscroll"></div>
</div>

<!-- Personalizar -->
<div id="ajustes" class="sheet hide">
  <div class="sheethead">
    <h2>Personalizar</h2>
    <button class="close" data-close="ajustes" aria-label="Cerrar">✕</button>
  </div>
  <div id="opts" class="opts"></div>
</div>

<!-- Mensajes rápidos por WhatsApp -->
<div id="msgs" class="sheet hide">
  <div class="sheethead">
    <h2>💬 Mensajes rápidos</h2>
    <button class="close" data-close="msgs" aria-label="Cerrar">✕</button>
  </div>
  <div id="msgList" class="pickscroll"></div>
</div>

<!-- Editar una rutina -->
<div id="rutina" class="sheet hide">
  <div class="sheethead">
    <h2>🚗 Rutina al arrancar</h2>
    <button id="rtDel" class="obtn red">Borrar</button>
    <button id="rtTest" class="obtn ghost">▶ Probar</button>
    <button id="rtSave" class="obtn">Guardar</button>
    <button class="close" data-close="rutina" aria-label="Cerrar">✕</button>
  </div>
  <div id="rtOpts" class="opts"></div>
</div>

<!-- Elegir un sitio -->
<div id="lugar" class="sheet hide">
  <div class="sheethead">
    <h2>🧭 ¿A dónde?</h2>
    <input id="lugarQ" type="search" placeholder="Dirección o sitio (ej.: Calle Mayor 5, Madrid)" autocomplete="off">
    <button id="lugarGo" class="obtn">Buscar</button>
    <button class="close" data-close="lugar" aria-label="Cerrar">✕</button>
  </div>
  <div id="lugarList" class="opts"></div>
</div>

<!-- Menú de un botón (mantener pulsado) -->
<div id="menu" class="modal hide">
  <div class="mbox">
    <h2 id="menuTitle">Botón</h2>
    <div id="menuBtns" class="menubtns"></div>
  </div>
</div>

<!-- Aviso de versión nueva -->
<div id="upd" class="modal hide">
  <div class="mbox">
    <h2>Hay una versión nueva</h2>
    <div id="updName" class="muted"></div>
    <pre id="updNotes"></pre>
    <div class="mbtns">
      <button id="updLater" class="obtn ghost">Más tarde</button>
      <button id="updGo" class="obtn">Actualizar</button>
    </div>
  </div>
</div>

<!-- Formulario pequeño -->
<div id="form" class="modal hide">
  <div class="mbox">
    <h2 id="formTitle"></h2>
    <div id="formFields"></div>
    <div id="formBtns" class="mbtns"></div>
  </div>
</div>

<!-- Aviso de rutina (5 s para cancelar) -->
<div id="rtBanner" class="rtbanner hide">
  <div class="rtt"><b id="rtText"></b><small id="rtSub"></small></div>
  <button id="rtNow" class="obtn ghost">Ya</button>
  <button id="rtCancel" class="obtn red">Cancelar</button>
</div>

<div id="toast" class="toast hide"></div>

<script src="prosync.js"></script>
<script src="app.js"></script>
</body>
</html>
